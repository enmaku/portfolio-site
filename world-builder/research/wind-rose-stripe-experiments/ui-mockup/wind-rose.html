<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wind rose</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --panel: #212121;
      --ink: rgba(255, 255, 255, 0.87);
      --muted: rgba(255, 255, 255, 0.6);
      --border: rgba(255, 255, 255, 0.12);
      --field: rgba(255, 255, 255, 0.09);
      /* Quasar theme tokens — single chrome color for mockup */
      --primary: #536369;
      --prev: #536369;
      --ortho: #536369;
      --random: #536369;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .map-row {
      display: flex;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .generation-controls-panel {
      flex: 0 0 auto;
      width: 300px;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }
    .panel-scroll {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
    }
    .seed-field {
      display: flex;
      align-items: stretch;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--field);
      overflow: hidden;
    }
    .seed-field:focus-within {
      border-color: var(--primary);
    }
    .seed-field__body {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .seed-field__label {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.2;
    }
    .seed-field__input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      padding: 0;
      appearance: textfield;
      -moz-appearance: textfield;
    }
    .seed-field__input::-webkit-inner-spin-button,
    .seed-field__input::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }
    .seed-field__dice {
      flex: 0 0 40px;
      width: 40px;
      border: 0;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .seed-field__dice:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.04);
    }
    .material-icons {
      font-size: 22px;
      line-height: 1;
      user-select: none;
    }
    .generation-control {
      padding-left: 8px;
      margin-bottom: 16px;
    }
    .generation-control--wind {
      margin-bottom: 0;
    }
    .generation-control__label {
      display: block;
      font-size: 12px;
      line-height: 1.25;
      letter-spacing: 0.03333em;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .generation-control__row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .generation-control__slider {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      padding: 0 4px;
      margin: 0;
      accent-color: var(--primary);
    }
    .generation-control__slider:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .wind-arrow {
      flex: 0 0 auto;
      color: var(--primary);
      transform-origin: center center;
    }
    .wind-arrow.prev { color: var(--prev); }
    .wind-arrow.ortho { color: var(--ortho); }
    .link-toggle-row {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px 0 4px;
      margin-left: 8px;
      margin-right: 30px; /* optical center vs arrow column */
    }
    .link-toggle {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .link-toggle .material-icons {
      font-size: 18px;
    }
    .link-toggle:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
    }
    .link-toggle[aria-pressed="true"] {
      color: var(--primary);
    }
    .link-toggle[aria-pressed="true"]:hover {
      color: #6d8189;
    }
    .chart-wrap {
      position: relative;
      width: 78%;
      aspect-ratio: 1;
      margin: 16px auto 0;
      overflow: hidden;
    }
    .chart-wrap canvas {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .map-host {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      background: #0d0d0d;
    }
  </style>
</head>
<body>
  <div class="map-row">
    <aside class="generation-controls-panel">
      <div class="panel-scroll">
        <div class="seed-field">
          <div class="seed-field__body">
            <label class="seed-field__label" for="seed-input">Geography seed</label>
            <input
              id="seed-input"
              class="seed-field__input"
              type="number"
              min="0"
              step="1"
              value="1370491305"
            />
          </div>
          <button
            id="seed-dice"
            class="seed-field__dice"
            type="button"
            aria-label="Random geography seed"
            title="Random geography seed"
          >
            <span class="material-icons" aria-hidden="true">casino</span>
          </button>
        </div>

        <div class="generation-control generation-control--wind">
          <span class="generation-control__label">
            Prevailing: <span id="prev-out">295°</span>
          </span>
          <div class="generation-control__row">
            <input
              id="prev-slider"
              class="generation-control__slider prev"
              type="range"
              min="0"
              max="359"
              step="1"
              value="295"
            />
            <span
              id="prev-arrow"
              class="material-icons wind-arrow prev"
              aria-hidden="true"
            >navigation</span>
          </div>
        </div>

        <div class="link-toggle-row">
          <button
            id="link-ortho"
            class="link-toggle"
            type="button"
            aria-pressed="true"
            aria-label="Link secondary maximum to prevailing"
            title="Link secondary maximum"
          >
            <span id="link-ortho-icon" class="material-icons" aria-hidden="true">link</span>
          </button>
        </div>

        <div class="generation-control">
          <span class="generation-control__label">
            Secondary maximum: <span id="ortho-out">25°</span>
          </span>
          <div class="generation-control__row">
            <input
              id="ortho-slider"
              class="generation-control__slider ortho"
              type="range"
              min="0"
              max="359"
              step="1"
              value="25"
            />
            <span
              id="ortho-arrow"
              class="material-icons wind-arrow ortho"
              aria-hidden="true"
            >navigation</span>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="rose" aria-label="Wind rose chart"></canvas>
        </div>
      </div>
    </aside>
    <div class="map-host"></div>
  </div>

<script>
  const YEAR_COUNT = 20
  const MIX = { prevailing: 0.35, orthogonal: 0.2, random: 0.45 }
  const BINS = 16
  const STEP = 360 / BINS
  const YEAR_W = 1 / YEAR_COUNT

  const seedInput = document.getElementById('seed-input')
  const seedDice = document.getElementById('seed-dice')
  const prevSlider = document.getElementById('prev-slider')
  const orthoSlider = document.getElementById('ortho-slider')
  const linkOrtho = document.getElementById('link-ortho')
  const linkOrthoIcon = document.getElementById('link-ortho-icon')
  const prevOut = document.getElementById('prev-out')
  const orthoOut = document.getElementById('ortho-out')
  const prevArrow = document.getElementById('prev-arrow')
  const orthoArrow = document.getElementById('ortho-arrow')

  let orthoOffset = 90
  let suppressing = false
  /** @type {{ kind: string, baseDeg: number }[]} */
  let template = []
  let prevailingAtRoll = 295

  function isLinked() {
    return linkOrtho.getAttribute('aria-pressed') === 'true'
  }

  function setLinked(linked) {
    linkOrtho.setAttribute('aria-pressed', linked ? 'true' : 'false')
    linkOrthoIcon.textContent = linked ? 'link' : 'link_off'
    linkOrtho.title = linked ? 'Unlink secondary maximum' : 'Link secondary maximum'
  }

  function mulberry32(seed) {
    let t = seed >>> 0
    return function next() {
      t += 0x6d2b79f5
      let r = Math.imul(t ^ (t >>> 15), 1 | t)
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r)
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296
    }
  }

  function normDeg(d) {
    return ((d % 360) + 360) % 360
  }

  function normalizeGeographySeed(geographySeed) {
    const normalizedSeed = geographySeed | 0
    return normalizedSeed >= 0 ? normalizedSeed : normalizedSeed + 4294967296
  }

  function createRandomGeographySeed() {
    return normalizeGeographySeed((Math.random() * 4294967296) | 0)
  }

  function derivePrevailingWindFromSeed(geographySeed) {
    const mixed = Math.imul(geographySeed | 0, 2654435761) ^ 0x9e3779b9
    return ((mixed % 360) + 360) % 360
  }

  function parseGeographySeedInput(rawSeed) {
    const parsed = Number.parseInt(String(rawSeed), 10)
    if (!Number.isFinite(parsed) || parsed < 0) return null
    return parsed | 0
  }

  function arrowRotation(degrees) {
    return Math.round(normDeg(degrees)) + 180
  }

  function binIndex(degrees) {
    return Math.round(normDeg(degrees) / STEP) % BINS
  }

  /** Same algorithm as temp harness buildWeightedSchedule. */
  function buildWeightedSchedule(slots, yearCount, seed) {
    const totalW = slots.reduce((s, x) => s + x.weight, 0)
    const ideal = slots.map((s) => (s.weight / totalW) * yearCount)
    const floors = ideal.map((x) => Math.floor(x))
    let rem = yearCount - floors.reduce((a, b) => a + b, 0)
    const fracOrder = ideal
      .map((x, i) => ({ i, frac: x - floors[i] }))
      .sort((a, b) => b.frac - a.frac)
    const counts = floors.slice()
    for (let k = 0; k < rem; k += 1) counts[fracOrder[k].i] += 1

    const winds = []
    const plan = []
    const rand = mulberry32(seed)
    for (let i = 0; i < slots.length; i += 1) {
      const slot = slots[i]
      for (let n = 0; n < counts[i]; n += 1) {
        if (slot.kind === 'fixed') {
          winds.push(slot.bearing)
          plan.push(slot.label)
        } else {
          winds.push(normDeg(rand() * 360))
          plan.push('random')
        }
      }
    }

    for (let i = winds.length - 1; i > 0; i -= 1) {
      const j = Math.floor(rand() * (i + 1))
      ;[winds[i], winds[j]] = [winds[j], winds[i]]
      ;[plan[i], plan[j]] = [plan[j], plan[i]]
    }
    return { winds, plan }
  }

  function rebuildTemplate(geographySeed, prevDeg) {
    const scheduleSeed = geographySeed ^ (YEAR_COUNT * 101)
    const { winds, plan } = buildWeightedSchedule(
      [
        { kind: 'fixed', bearing: 0, weight: MIX.prevailing, label: 'prevailing' },
        { kind: 'fixed', bearing: 0, weight: MIX.orthogonal, label: 'orthogonal' },
        { kind: 'random', weight: MIX.random, label: 'random' },
      ],
      YEAR_COUNT,
      scheduleSeed,
    )
    template = plan.map((kind, i) => ({
      kind,
      baseDeg: kind === 'random' ? winds[i] : 0,
    }))
    prevailingAtRoll = prevDeg
  }

  function buildSchedule(prevDeg, orthoDeg) {
    const delta = prevDeg - prevailingAtRoll
    return template.map((row) => {
      if (row.kind === 'prevailing') return { kind: row.kind, deg: prevDeg }
      if (row.kind === 'orthogonal') return { kind: row.kind, deg: orthoDeg }
      return { kind: 'random', deg: normDeg(row.baseDeg + delta) }
    })
  }

  function aggregate(rows) {
    const byKind = {
      prevailing: new Array(BINS).fill(0),
      orthogonal: new Array(BINS).fill(0),
      random: new Array(BINS).fill(0),
    }
    for (const row of rows) {
      byKind[row.kind][binIndex(row.deg)] += YEAR_W
    }
    const totals = Array.from({ length: BINS }, (_, i) =>
      byKind.prevailing[i] + byKind.orthogonal[i] + byKind.random[i],
    )
    const display = totals.map((w) => Math.sqrt(w))
    const colors = totals.map((_, i) => {
      const p = byKind.prevailing[i]
      const o = byKind.orthogonal[i]
      const r = byKind.random[i]
      if (p + o + r > 0) return 'rgba(83, 99, 105, 0.92)'
      return 'rgba(255, 255, 255, 0.08)'
    })
    return { display, colors }
  }

  const chart = new Chart(document.getElementById('rose'), {
    type: 'polarArea',
    data: {
      labels: Array(BINS).fill(''),
      datasets: [
        {
          data: new Array(BINS).fill(0),
          backgroundColor: new Array(BINS).fill('rgba(255, 255, 255, 0.08)'),
          borderColor: 'rgba(33, 33, 33, 0.95)',
          borderWidth: 1.5,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      layout: {
        autoPadding: false,
        padding: 0,
      },
      scales: {
        r: {
          beginAtZero: true,
          min: 0,
          max: Math.sqrt(0.4),
          ticks: { display: false },
          grid: { color: 'rgba(255, 255, 255, 0.12)' },
          angleLines: { color: 'rgba(255, 255, 255, 0.12)' },
          pointLabels: { display: false, padding: 0 },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false },
        title: { display: false },
      },
    },
  })

  function syncOrthoEnabled() {
    orthoSlider.disabled = isLinked()
  }

  function setOrthoFromOffset(prevDeg) {
    suppressing = true
    orthoSlider.value = String(Math.round(normDeg(prevDeg + orthoOffset)))
    suppressing = false
  }

  function setArrow(el, degrees) {
    el.style.transform = `rotate(${arrowRotation(degrees)}deg)`
  }

  function update() {
    const prevDeg = Number(prevSlider.value)
    const orthoDeg = Number(orthoSlider.value)
    const agg = aggregate(buildSchedule(prevDeg, orthoDeg))
    chart.data.datasets[0].data = agg.display
    chart.data.datasets[0].backgroundColor = agg.colors
    chart.update('none')
    prevOut.textContent = `${Math.round(prevDeg)}°`
    orthoOut.textContent = `${Math.round(orthoDeg)}°`
    setArrow(prevArrow, prevDeg)
    setArrow(orthoArrow, orthoDeg)
  }

  function applySeed(rawSeed, { randomize = false } = {}) {
    let parsed = parseGeographySeedInput(rawSeed)
    if (parsed === null && randomize) parsed = createRandomGeographySeed()
    if (parsed === null) return
    const geographySeed = normalizeGeographySeed(parsed)
    const prevDeg = derivePrevailingWindFromSeed(geographySeed | 0)
    seedInput.value = String(geographySeed)
    suppressing = true
    prevSlider.value = String(prevDeg)
    if (isLinked()) setOrthoFromOffset(prevDeg)
    suppressing = false
    rebuildTemplate(geographySeed, prevDeg)
    update()
  }

  seedDice.addEventListener('click', () => {
    applySeed(createRandomGeographySeed(), { randomize: true })
  })

  seedInput.addEventListener('change', () => applySeed(seedInput.value))
  seedInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault()
      applySeed(seedInput.value)
    }
  })

  prevSlider.addEventListener('input', () => {
    if (suppressing) return
    const prevDeg = Number(prevSlider.value)
    if (isLinked()) setOrthoFromOffset(prevDeg)
    update()
  })

  orthoSlider.addEventListener('input', () => {
    if (suppressing) return
    if (isLinked()) {
      orthoOffset = normDeg(Number(orthoSlider.value) - Number(prevSlider.value))
    }
    update()
  })

  linkOrtho.addEventListener('click', () => {
    const next = !isLinked()
    if (next) {
      orthoOffset = normDeg(Number(orthoSlider.value) - Number(prevSlider.value))
    }
    setLinked(next)
    syncOrthoEnabled()
    update()
  })

  // Initial: user repro seed; keep known 295/25 rather than re-deriving from seed
  // so the first paint matches the locked experiment. Dice/commit use live derive.
  setLinked(true)
  rebuildTemplate(1370491305, 295)
  syncOrthoEnabled()
  update()
</script>
</body>
</html>
